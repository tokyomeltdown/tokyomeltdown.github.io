<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>x header</title>
<!--
  Source for the X profile header, 1500x500:

      bash tools/make-og.sh x

  writes tools/x-header.png, which is ignored by git and uploaded to X by hand.
  The frequency ticks and the tag sit where a 20 Hz to 20 kHz log axis puts
  them, the same axis the page's curve uses.

  X lays the profile picture over the lower left and crops the top and bottom
  on phones, so everything that has to be read sits in the middle band and
  right of centre. The left third carries only the line.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px;overflow:hidden}
  body{background:#eceef0;color:#1b1f23;position:relative;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(60,66,72,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(60,66,72,.06) 1px,transparent 1px),
      linear-gradient(rgba(60,66,72,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(60,66,72,.045) 1px,transparent 1px);
    background-size:24px 24px,24px 24px,120px 120px,120px 120px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;letter-spacing:.08em;color:#5d646c}
  svg.sig{position:absolute;inset:0;width:1500px;height:500px}
  .head{position:absolute;right:96px;top:98px;text-align:right}
  .brand{display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:700;letter-spacing:-.02em}
  .brand svg{width:38px;height:35px}
  h1{margin-top:18px;font-size:60px;line-height:.98;font-weight:700;letter-spacing:-.045em}
  h1 em{font-style:normal;color:#c86a4f}
  .tl{position:absolute;left:96px;top:92px}
  .foot{position:absolute;right:96px;bottom:84px;text-align:right}
  .foot b{color:#1b1f23;font-weight:600}
</style>
</head>
<body>
<div class="grid"></div>
<svg class="sig" viewBox="0 0 1500 500" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <line x1="0" y1="330" x2="1500" y2="330" stroke="rgba(60,66,72,.22)" stroke-width="1"/>
  <!-- cut on the left, one bell lifted in the middle, a shelf up at the top end -->
  <path d="M0 344 C120 344 220 330 340 330 L340 330 L0 330 Z" fill="rgba(47,144,136,.16)"/>
  <path d="M340 330 C420 330 470 236 540 236 C610 236 660 330 760 330 C900 330 1000 330 1100 330 C1250 330 1350 318 1500 316 L1500 330 Z" fill="rgba(200,106,79,.16)"/>
  <path d="M0 316 C120 316 220 330 340 330 C420 330 470 424 540 424 C610 424 660 330 760 330 C900 330 1000 330 1100 330 C1250 330 1350 342 1500 344" stroke="rgba(27,31,35,.16)" stroke-width="3"/>
  <path d="M0 344 C120 344 220 330 340 330 C420 330 470 236 540 236 C610 236 660 330 760 330 C900 330 1000 330 1100 330 C1250 330 1350 318 1500 316" stroke="#2b3238" stroke-width="3"/>
  <circle cx="540" cy="236" r="5" fill="#2b3238"/>
  <text x="556" y="220" font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="16" fill="#c86a4f">+4.1 dB  240 Hz</text>
  <!-- frequency ticks along the bottom of the band -->
  <g font-family="ui-monospace,SF Mono,Menlo,monospace" font-size="12" fill="rgba(135,142,150,.9)" text-anchor="middle">
    <text x="199" y="462">50</text><text x="349" y="462">100</text><text x="500" y="462">200</text><text x="699" y="462">500</text><text x="849" y="462">1k</text><text x="1000" y="462">2k</text><text x="1199" y="462">5k</text><text x="1349" y="462">10k</text>
  </g>
</svg>
<div class="tl mono">fig.00 / signal</div>
<div class="head">
  <div class="brand">
    <svg viewBox="-2 0 24 22" fill="none" stroke-linecap="round">
      <line x1="-1" y1="11" x2="21" y2="11" stroke="#3c4248" stroke-opacity=".3" stroke-width=".9"/>
      <path d="M0 13 C4 13 6 19 10 19 C14 19 16 15 20 15" stroke="#1b1f23" stroke-opacity=".34" stroke-width="2.4"/>
      <path d="M0 9 C4 9 6 3 10 3 C14 3 16 7 20 7" stroke="#2b3238" stroke-width="2.1"/>
    </svg>
    tokyomeltdown
  </div>
  <h1>Mac tools for people<br>who work with <em>sound.</em></h1>
</div>
<div class="foot mono"><b>EQ Mirror</b> · caps REC · LUFSBar Pro · LUFSBar · VOX Normalizer</div>
</body>
</html>
